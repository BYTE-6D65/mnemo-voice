<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mnemo Voice</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a0f;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }

        /* Status */
        .status {
            text-align: center;
            margin-bottom: 30px;
        }
        .status-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            vertical-align: middle;
        }
        .status-dot.connected { background: #4ade80; }
        .status-dot.disconnected { background: #ef4444; }
        .status-dot.thinking { background: #facc15; animation: pulse 1s infinite; }
        .status-text {
            font-size: 14px;
            color: #888;
            vertical-align: middle;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Waveform visualizer */
        .visualizer {
            width: 100%;
            height: 120px;
            margin: 20px 0;
            border-radius: 12px;
            background: #111118;
            overflow: hidden;
        }
        .visualizer canvas {
            width: 100%;
            height: 100%;
        }

        /* Mic button */
        .mic-container {
            text-align: center;
            margin: 20px 0;
        }
        .mic-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #333;
            background: #1a1a24;
            color: #e0e0e0;
            font-size: 32px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .mic-btn:hover { border-color: #555; background: #222230; }
        .mic-btn.active {
            border-color: #ef4444;
            background: #2a1015;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
        }
        .mic-btn.speaking {
            border-color: #4ade80;
            background: #0a2a15;
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.3);
        }

        /* Chat log */
        .chat-log {
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
            border-radius: 12px;
            background: #111118;
            padding: 15px;
        }
        .chat-entry {
            margin-bottom: 10px;
            font-size: 14px;
            line-height: 1.5;
        }
        .chat-entry.user { color: #93c5fd; }
        .chat-entry.agent { color: #c4b5fd; }
        .chat-entry.system { color: #666; font-style: italic; font-size: 12px; }
        .chat-entry .timestamp {
            color: #444;
            font-size: 11px;
            margin-right: 8px;
        }

        /* Text input fallback */
        .text-input {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .text-input input {
            flex: 1;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #1a1a24;
            color: #e0e0e0;
            font-size: 14px;
            outline: none;
        }
        .text-input input:focus { border-color: #555; }
        .text-input button {
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #1a1a24;
            color: #e0e0e0;
            cursor: pointer;
            font-size: 14px;
        }
        .text-input button:hover { background: #222230; }
    </style>
</head>
<body>
    <div class="container">
        <div class="status">
            <span class="status-dot disconnected" id="statusDot"></span>
            <span class="status-text" id="statusText">Connecting...</span>
        </div>

        <div class="visualizer">
            <canvas id="visualizer"></canvas>
        </div>

        <div class="mic-container">
            <button class="mic-btn" id="micBtn" title="Push to talk">🎙</button>
        </div>

        <div class="chat-log" id="chatLog"></div>

        <div class="text-input">
            <input type="text" id="textInput" placeholder="Type a message..." />
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
